AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: WellArchitected API Proxy Lambda with API Gateway

Resources:
  WellArchitectedProxyFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: lambda_function.lambda_handler
      Runtime: python3.9
      Timeout: 30
      MemorySize: 256
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - wellarchitected:*
              Resource: '*'
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /proxy
            Method: post
            RestApiId: !Ref WellArchitectedProxyApi

  WellArchitectedProxyApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowMethods: "'OPTIONS,POST'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: "'*'"

Outputs:
  WellArchitectedProxyApi:
    Description: API Gateway endpoint URL for Prod stage for WellArchitected Proxy function
    Value: !Sub "https://${WellArchitectedProxyApi}.execute-api.${AWS::Region}.amazonaws.com/prod/proxy"
  
  WellArchitectedProxyFunction:
    Description: WellArchitected Proxy Lambda Function ARN
    Value: !GetAtt WellArchitectedProxyFunction.Arn
