AWSTemplateFormatVersion: '2010-09-09'
Description: WellArchitected API Proxy Lambda with API Gateway and IP restriction

Resources:
  WellArchitectedProxyFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: wellarchitected-proxy
      Handler: lambda_function.lambda_handler
      Role: !GetAtt WellArchitectedProxyRole.Arn
      Code:
        S3Bucket: wellarchitected-proxy-deployment-288206176536
        S3Key: function.zip
      Runtime: python3.9
      Timeout: 30
      MemorySize: 256

  WellArchitectedProxyRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/WellArchitectedToolReadOnlyAccess

  WellArchitectedProxyApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: WellArchitectedProxy
      Description: API Gateway for WellArchitected Proxy with IP restriction
      EndpointConfiguration:
        Types:
          - REGIONAL
      Policy:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: 'execute-api:Invoke'
            Resource: '*'
          - Effect: Deny
            Principal: '*'
            Action: 'execute-api:Invoke'
            Resource: '*'
            Condition:
              NotIpAddress:
                'aws:SourceIp': '159.196.13.45/32'

  WellArchitectedProxyResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref WellArchitectedProxyApi
      ParentId: !GetAtt WellArchitectedProxyApi.RootResourceId
      PathPart: proxy

  WellArchitectedProxyMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref WellArchitectedProxyApi
      ResourceId: !Ref WellArchitectedProxyResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WellArchitectedProxyFunction.Arn}/invocations
      ApiKeyRequired: false

  WellArchitectedProxyOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref WellArchitectedProxyApi
      ResourceId: !Ref WellArchitectedProxyResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
              method.response.header.Access-Control-Allow-Methods: "'OPTIONS,POST'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
            ResponseTemplates:
              application/json: '{}'
        PassthroughBehavior: WHEN_NO_MATCH
        RequestTemplates:
          application/json: '{"statusCode": 200}'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  WellArchitectedProxyDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - WellArchitectedProxyMethod
      - WellArchitectedProxyOptionsMethod
    Properties:
      RestApiId: !Ref WellArchitectedProxyApi
      StageName: prod

  WellArchitectedProxyPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WellArchitectedProxyFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WellArchitectedProxyApi}/*/POST/proxy

Outputs:
  WellArchitectedProxyApi:
    Description: API Gateway endpoint URL for Prod stage for WellArchitected Proxy function
    Value: !Sub https://${WellArchitectedProxyApi}.execute-api.${AWS::Region}.amazonaws.com/prod/proxy
  
  WellArchitectedProxyFunction:
    Description: WellArchitected Proxy Lambda Function ARN
    Value: !GetAtt WellArchitectedProxyFunction.Arn
