AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudFormation StackSet to deploy DevOps Conformance Pack across multiple accounts and regions'

Parameters:
  ConformancePackName:
    Type: String
    Default: DevOpsConformancePack
    Description: Name of the Conformance Pack to be deployed
    
  S3BucketName:
    Type: String
    Description: S3 bucket name where the conformance pack template is stored
    
  S3KeyPrefix:
    Type: String
    Default: conformance-packs/
    Description: S3 key prefix where the conformance pack template is stored
    
  S3BucketRegion:
    Type: String
    Default: us-east-1
    Description: Region where the S3 bucket is located
    
  DeliveryS3BucketName:
    Type: String
    Description: S3 bucket name where AWS Config will deliver evaluation results
    
  DeliveryS3KeyPrefix:
    Type: String
    Default: config-delivery/
    Description: S3 key prefix where AWS Config will deliver evaluation results
    
  RemediationRoleName:
    Type: String
    Default: ConfigRemediationRole
    Description: Name of the IAM role that AWS Config will assume for remediation actions

Resources:
  # IAM Role for Config Remediation
  ConfigRemediationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RemediationRoleName
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ssm.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonSSMAutomationRole
      Policies:
        - PolicyName: ConfigRemediationPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutEncryptionConfiguration
                  - s3:PutBucketPolicy
                  - cloudtrail:CreateTrail
                  - cloudtrail:StartLogging
                  - cloudtrail:UpdateTrail
                  - ecr:PutImageScanningConfiguration
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'

  # S3 Bucket Policy for Config Delivery
  DeliveryS3BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DeliveryS3BucketName
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AWSConfigBucketPermissionsCheck
            Effect: Allow
            Principal:
              Service: config.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !Sub arn:aws:s3:::${DeliveryS3BucketName}
          - Sid: AWSConfigBucketDelivery
            Effect: Allow
            Principal:
              Service: config.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub arn:aws:s3:::${DeliveryS3BucketName}/${DeliveryS3KeyPrefix}AWSLogs/${AWS::AccountId}/Config/*
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control

  # AWS Config Conformance Pack
  DevOpsConformancePack:
    Type: AWS::Config::ConformancePack
    Properties:
      ConformancePackName: !Ref ConformancePackName
      DeliveryS3Bucket: !Ref DeliveryS3BucketName
      DeliveryS3KeyPrefix: !Ref DeliveryS3KeyPrefix
      TemplateS3Uri: !Sub s3://${S3BucketName}/${S3KeyPrefix}devops-conformance-pack.yaml
      ConformancePackInputParameters:
        - ParameterName: RemediationRoleArn
          ParameterValue: !GetAtt ConfigRemediationRole.Arn

Outputs:
  ConformancePackId:
    Description: ID of the deployed Conformance Pack
    Value: !Ref DevOpsConformancePack
    
  RemediationRoleArn:
    Description: ARN of the IAM role used for remediation actions
    Value: !GetAtt ConfigRemediationRole.Arn
